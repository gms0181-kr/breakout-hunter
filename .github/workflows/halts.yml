name: Verify halt sources
on:
  push:
    branches: [main]
    paths: ['hunter/halts.py', '.github/workflows/halts.yml', 'tests/test_halts.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hunter-halt-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m hunter.halts
      - name: Persist halt evidence
        run: |
          git config user.name "breakout-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/halt-source-probe.json
          git diff --cached --quiet || git commit -m "Record official halt-source probe [skip ci]"
          git pull --rebase origin main
          git push
