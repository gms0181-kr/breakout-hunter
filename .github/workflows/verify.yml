name: Verify production
on:
  push:
    paths: ['.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m compileall -q hunter tests
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Test live mobile, desktop and 60-second refresh
        env:
          SITE_URL: https://gms0181-kr.github.io/breakout-hunter/
        run: python tests/browser_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: qa/
