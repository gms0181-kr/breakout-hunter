name: Enrich float and borrow
on:
  push:
    branches: [main]
    paths: ['hunter/float_ctb.py', 'tests/test_float_ctb.py', '.github/workflows/float-ctb.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Test and collect']
    types: [completed]
  schedule:
    - cron: '7,22,37,52 12-23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: float-borrow-enrichment
  cancel-in-progress: false
jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m hunter.float_ctb
      - name: Persist enrichment
        run: python -m hunter.persist enrichment
