name: Time Machine archive and verification
on:
  push:
    branches: [main]
    paths:
      - 'hunter/time_machine*.py'
      - 'tests/test_time_machine.py'
      - 'public/time-machine*.js'
      - 'public/time-machine.html'
      - 'public/time-machine-service.json'
      - 'time-machine-service/**'
      - 'tests/time_machine_browser.py'
      - 'scripts/build_time_machine_job_index.py'
      - 'tests/test_time_machine_job_index.py'
      - '.github/workflows/time-machine.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Short Squeeze Hunter']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: independent-time-machine
  # This read-only derived export is replaceable; live Hunter is unaffected.
  cancel-in-progress: true
jobs:
  archive:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Authenticated execution gateway tests
        run: node --test time-machine-service/tests/*.test.mjs
      - name: Point-in-time and existing regression tests
        run: python -m unittest discover -s tests -v
      - name: Build historical immutable inputs and separate outcome data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u -m hunter.time_machine_build
      - name: Index completed external requests for browser lookup
        run: python scripts/build_time_machine_job_index.py
      - name: Browser runtime replay verification
        run: |
          python -m pip install playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
          python tests/time_machine_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-machine-evidence
          path: |
            public/time-machine/demo.json
            public/time-machine/index.json
            qa/time-machine*
      - name: Persist only independent Time Machine outputs
        run: |
          git config user.name breakout-hunter-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/time-machine
          git diff --cached --quiet && exit 0
          git commit -m 'Archive point-in-time research bundles [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
          done
          exit 1
