name: Test and collect
on:
  push:
    branches: [main]
    paths:
      - 'hunter/**'
      - 'tests/test*.py'
      - 'tests/fixtures/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: hunter-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit and HUBC regression tests
        run: python -m unittest discover -s tests -v
      - name: Test provider connections without exposing credentials
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m hunter.probe
      - name: Collect whole listing universe and price batches
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m hunter.run
      - name: Refresh float and borrow for manually collected candidates
        if: github.event_name == 'workflow_dispatch'
        run: python -m hunter.float_ctb
      - uses: actions/upload-artifact@v4
        with:
          name: scan-evidence
          path: |
            public/data.json
            public/hubc-backtest.json
            hunter.sqlite
      - name: Persist observed results
        run: python -m hunter.persist scan
