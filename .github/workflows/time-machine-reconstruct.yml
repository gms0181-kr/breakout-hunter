name: Time Machine historical reconstruction
run-name: TIME MACHINE ${{ inputs.request_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      et:
        description: 'Historical ET local date/time (YYYY-MM-DDTHH:MM)'
        required: true
      scope:
        type: choice
        options: [all, china]
        default: all
      request_id:
        description: 'Server-issued job UUID'
        required: true
permissions:
  contents: write
concurrency:
  group: authenticated-time-machine-collection
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Regression and historical availability tests
        run: python -m unittest discover -s tests -v
      - name: External historical collection and existing engine analysis
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          REQUEST_ET: ${{ inputs.et }}
          REQUEST_SCOPE: ${{ inputs.scope }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python -u -m hunter.time_machine_job --request-id "$REQUEST_ID" --et "$REQUEST_ET" --scope "$REQUEST_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-machine-job-evidence
          retention-days: 90
          path: public/time-machine/jobs/
      - name: Publish immutable job result
        run: |
          git config user.name breakout-hunter-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'public/time-machine/jobs/*.json'
          git diff --cached --quiet && exit 0
          git commit -m 'Publish immutable Time Machine job result [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
          done
          exit 1
