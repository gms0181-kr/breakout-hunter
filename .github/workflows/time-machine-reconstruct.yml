name: Time Machine historical reconstruction
on:
  push:
    branches: [main]
    paths:
      - 'hunter/time_machine_reconstruct.py'
      - 'tests/test_time_machine_reconstruct.py'
      - '.github/workflows/time-machine-reconstruct.yml'
  workflow_dispatch:
    inputs:
      et:
        description: 'Historical ET local date/time (YYYY-MM-DDTHH:MM)'
        required: true
        default: '2026-10-15T12:00'
      scope:
        description: 'Universe scope (historical China classification may be unavailable)'
        type: choice
        options: [all, china]
        default: all
permissions:
  contents: write
concurrency:
  group: independent-historical-reconstruction
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Regression and historical availability tests
        run: python -m unittest discover -s tests -v
      - name: External historical reconstruction (no alerts or future prices)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          REQUEST_ET: ${{ inputs.et || '2026-10-15T12:00' }}
          REQUEST_SCOPE: ${{ inputs.scope || 'all' }}
        run: python -u -m hunter.time_machine_reconstruct --et "$REQUEST_ET" --scope "$REQUEST_SCOPE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-reconstruction-evidence
          retention-days: 90
          path: |
            public/time-machine/reconstruction-latest.json
            public/time-machine/reconstruction-latest.inputs.json.gz
      - name: Publish isolated reconstruction result
        run: |
          git config user.name breakout-hunter-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/time-machine/reconstruction-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish external historical reconstruction [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
          done
          exit 1
